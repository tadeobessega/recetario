<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Recetario Personal</title>
    <!-- Tipografía: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'ui-sans-serif', 'system-ui', '-apple-system', '"Segoe UI"', 'Roboto', 'Arial', 'sans-serif'],
                    },
                    colors: {
                        'fondo': '#fcfbf8',
                        'beige-base': '#f7f5ef',
                        'beige-card': '#ffffff',
                        'beige-border': '#ebe7dc',
                        'verde-ingles': '#1b4332',
                        'verde-hover': '#2d5a27',
                        'verde-chip': '#2d6a4f',
                        'mostaza': '#c68b59',
                        'mostaza-hover': '#b07d3b',
                        'rojo-excluir': '#c0392b',
                        'rojo-hover': '#a93226'
                    },
                    boxShadow: {
                        'soft': '0 1px 2px rgba(27, 67, 50, 0.04), 0 6px 20px rgba(27, 67, 50, 0.05)',
                        'soft-lg': '0 12px 40px rgba(27, 67, 50, 0.10)'
                    }
                }
            }
        }
    </script>
    <style>
        *, *::before, *::after, ::placeholder { font-style: normal !important; }
        em, i, cite, address, dfn, var { font-style: normal !important; }
        body {
            background-color: #fcfbf8;
            color: #2b2d42;
            font-family: 'Inter', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
            letter-spacing: 0.02em;
            line-height: 1.65;
        }
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #fcfbf8;
        }
        ::-webkit-scrollbar-thumb {
            background: #c68b59;
            border-radius: 4px;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-2px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .chip-anim {
            animation: fadeIn 0.15s ease-out forwards;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col font-sans antialiased bg-fondo text-gray-800">

    <!-- PANTALLA DE LOGIN -->
    <div id="pantalla-login" class="min-h-screen flex items-center justify-center p-4">
        <div class="bg-beige-card w-full max-w-sm rounded-2xl p-6 sm:p-8 shadow-soft-lg border border-beige-border space-y-6">
            <div class="text-center space-y-2">
                <div class="inline-flex p-3 bg-beige-base rounded-2xl border border-beige-border text-verde-ingles">
                    <svg class="w-8 h-8 text-mostaza" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"></path>
                    </svg>
                </div>
                <h1 class="text-xl font-semibold text-verde-ingles">Mi Recetario</h1>
                <p id="login-subtitulo" class="text-sm text-gray-500">Inicia sesión para ver tus recetas</p>
            </div>

            <form onsubmit="ejecutarLogin(event)" class="space-y-5">
                <div>
                    <label class="block text-sm font-medium text-verde-ingles mb-2">Usuario</label>
                    <input type="text" id="login-usuario" required placeholder="Usuario" class="w-full p-3 bg-beige-base border border-beige-border rounded-xl text-sm focus:ring-1 focus:ring-verde-ingles focus:outline-none">
                </div>
                <div>
                    <label class="block text-sm font-medium text-verde-ingles mb-2">Contraseña</label>
                    <input type="password" id="login-password" required placeholder="••••••••" class="w-full p-3 bg-beige-base border border-beige-border rounded-xl text-sm focus:ring-1 focus:ring-verde-ingles focus:outline-none">
                </div>

                <div id="login-error" class="hidden text-sm text-rojo-excluir text-center font-medium bg-red-50 p-2 rounded-lg border border-red-200"></div>

                <button type="submit" id="btn-login-submit" class="w-full bg-verde-ingles hover:bg-verde-hover text-white py-2.5 rounded-xl text-sm font-medium shadow-soft transition flex items-center justify-center gap-2">
                    <span>Ingresar</span>
                </button>
                <p class="text-center text-sm text-gray-500">¿No tenés cuenta? <button type="button" onclick="mostrarRegistro(true)" class="text-verde-ingles font-medium underline">Registrate</button></p>
            </form>

            <form id="form-registro" onsubmit="ejecutarRegistro(event)" class="hidden space-y-4">
                <div>
                    <label class="block text-sm font-medium text-verde-ingles mb-2">Nombre</label>
                    <input type="text" id="reg-nombre" required placeholder="Tu nombre" class="w-full p-3 bg-beige-base border border-beige-border rounded-xl text-sm focus:ring-1 focus:ring-verde-ingles focus:outline-none">
                </div>
                <div>
                    <label class="block text-sm font-medium text-verde-ingles mb-2">Nombre de usuario</label>
                    <input type="text" id="reg-usuario" required maxlength="20" autocapitalize="none" autocomplete="off" placeholder="tu_usuario" oninput="verificarUsuarioLive()" class="w-full p-3 bg-beige-base border border-beige-border rounded-xl text-sm focus:ring-1 focus:ring-verde-ingles focus:outline-none">
                    <p id="reg-usuario-hint" class="text-xs text-gray-500 mt-2">3 a 20 caracteres: letras minúsculas, números y _</p>
                </div>
                <div>
                    <label class="block text-sm font-medium text-verde-ingles mb-2">Email</label>
                    <input type="email" id="reg-email" required placeholder="tu@email.com" class="w-full p-3 bg-beige-base border border-beige-border rounded-xl text-sm focus:ring-1 focus:ring-verde-ingles focus:outline-none">
                </div>
                <div>
                    <label class="block text-sm font-medium text-verde-ingles mb-2">Contraseña</label>
                    <input type="password" id="reg-password" required minlength="6" placeholder="Mínimo 6 caracteres" class="w-full p-3 bg-beige-base border border-beige-border rounded-xl text-sm focus:ring-1 focus:ring-verde-ingles focus:outline-none">
                </div>

                <div id="reg-mensaje" class="hidden text-sm text-center font-medium p-2 rounded-lg border"></div>

                <button type="submit" id="btn-registro-submit" class="w-full bg-verde-ingles hover:bg-verde-hover text-white py-2.5 rounded-xl text-sm font-medium shadow-soft transition flex items-center justify-center gap-2">
                    <span>Crear cuenta</span>
                </button>
                <p class="text-center text-sm text-gray-500">¿Ya tenés cuenta? <button type="button" onclick="mostrarRegistro(false)" class="text-verde-ingles font-medium underline">Ingresá</button></p>
            </form>
        </div>
    </div>

    <!-- APP PRINCIPAL -->
    <div id="app-principal" class="hidden min-h-screen flex flex-col">
        <header class="bg-verde-ingles text-beige-card shadow-soft sticky top-0 z-30">
            <div class="max-w-4xl mx-auto px-4 sm:px-6 py-3.5 flex flex-row justify-between items-center gap-3">
                <div class="flex items-center gap-2.5">
                    <div class="p-2 bg-verde-hover/60 rounded-xl">
                        <svg class="w-5 h-5 text-mostaza" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"></path>
                        </svg>
                    </div>
                    <h1 class="text-lg font-semibold text-white">Mi Recetario</h1>
                </div>

                <div class="flex items-center gap-2 sm:gap-3">
                    <nav class="flex bg-verde-hover/50 p-1 rounded-xl">
                        <button id="tab-btn-filtrar" onclick="cambiarPestana('filtrar')" class="px-3.5 py-2 rounded-lg text-sm font-medium transition flex items-center gap-1.5 bg-beige-card text-verde-ingles shadow-sm">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                            <span class="hidden sm:inline">Recetas</span>
                        </button>
                        <button id="tab-btn-agregar" onclick="cambiarPestana('agregar')" class="px-3.5 py-2 rounded-lg text-sm font-medium transition flex items-center gap-1.5 text-beige-card hover:text-white">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
                            <span class="hidden sm:inline">Agregar</span>
                        </button>
                    </nav>

                    <button id="btn-avatar-header" onclick="abrirPerfil()" title="Mi perfil" class="rounded-full ring-2 ring-white/20 hover:ring-white/70 transition"></button>

                    <button onclick="cerrarSesion()" title="Cerrar Sesión" class="p-2 text-green-200 hover:text-white hover:bg-verde-hover/60 rounded-xl transition">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg>
                    </button>
                </div>
            </div>
        </header>

        <main class="flex-grow max-w-4xl w-full mx-auto px-4 sm:px-6 py-10">

            <!-- PESTAÑA FILTRAR RECETAS -->
            <section id="pestana-filtrar" class="space-y-6">
                <div id="card-filtros" class="bg-beige-card rounded-2xl p-5 sm:p-7 shadow-soft border border-beige-border space-y-5">
                    <div class="flex items-center justify-between pb-2 border-b border-beige-border/80">
                        <div class="flex items-center gap-2 text-verde-ingles font-semibold text-sm">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 4a1 1 0 011-1h16a1 1 0 011 1v2.586a1 1 0 01-.293.707l-6.414 6.414a1 1 0 00-.293.707V17l-4 4v-6.586a1 1 0 00-.293-.707L3.293 7.293A1 1 0 013 6.586V4z"></path></svg>
                            <span>Filtros de Búsqueda</span>
                        </div>
                        <span id="contador-resultados" class="text-sm text-gray-500 bg-beige-base px-2.5 py-1 rounded-full border border-beige-border font-medium">
                            0 recetas
                        </span>
                    </div>

                    <div class="relative">
                        <svg class="w-4 h-4 absolute left-3 top-1/2 -translate-y-1/2 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                        <input type="text" id="input-busqueda-nombre" placeholder="Buscar por nombre o contenido..." oninput="filtrarRecetas()" class="w-full pl-10 pr-4 py-3 bg-beige-base border border-beige-border rounded-xl focus:outline-none focus:ring-1 focus:ring-verde-ingles text-sm">
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div class="space-y-1.5">
                            <label class="text-sm font-semibold text-verde-ingles flex items-center gap-1.5">
                                <span class="w-2 h-2 rounded-full bg-verde-chip"></span>
                                Ingredientes que tengo
                            </label>
                            <div class="relative">
                                <button type="button" onclick="toggleDropdown('dropdown-incluir')" class="w-full bg-beige-base border border-beige-border rounded-xl p-3 text-left flex justify-between items-center text-sm shadow-sm hover:border-verde-ingles focus:outline-none">
                                    <span class="text-gray-500 truncate" id="label-dropdown-incluir">Seleccionar ingrediente...</span>
                                    <svg class="w-4 h-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                                </button>
                                <div id="dropdown-incluir" class="hidden absolute left-0 right-0 top-full mt-1 bg-white border border-beige-border rounded-xl shadow-soft-lg z-30 max-h-56 flex flex-col p-2 space-y-1.5">
                                    <input type="text" id="search-incluir" placeholder="Buscar..." oninput="filtrarOpcionesDropdown('incluir')" class="w-full p-2.5 text-sm bg-beige-base border border-beige-border rounded-lg focus:outline-none focus:ring-1 focus:ring-verde-ingles">
                                    <div id="lista-opciones-incluir" class="overflow-y-auto space-y-0.5 flex-grow"></div>
                                </div>
                            </div>
                            <div id="container-chips-incluir" class="flex flex-wrap gap-1 min-h-[28px]"></div>
                        </div>

                        <div class="space-y-1.5">
                            <label class="text-sm font-semibold text-rojo-excluir flex items-center gap-1.5">
                                <span class="w-2 h-2 rounded-full bg-rojo-excluir"></span>
                                Ingredientes que no tengo
                            </label>
                            <div class="relative">
                                <button type="button" onclick="toggleDropdown('dropdown-excluir')" class="w-full bg-beige-base border border-beige-border rounded-xl p-3 text-left flex justify-between items-center text-sm shadow-sm hover:border-rojo-excluir focus:outline-none">
                                    <span class="text-gray-500 truncate" id="label-dropdown-excluir">Seleccionar ingrediente...</span>
                                    <svg class="w-4 h-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                                </button>
                                <div id="dropdown-excluir" class="hidden absolute left-0 right-0 top-full mt-1 bg-white border border-beige-border rounded-xl shadow-soft-lg z-30 max-h-56 flex flex-col p-2 space-y-1.5">
                                    <input type="text" id="search-excluir" placeholder="Buscar..." oninput="filtrarOpcionesDropdown('excluir')" class="w-full p-2.5 text-sm bg-beige-base border border-beige-border rounded-lg focus:outline-none focus:ring-1 focus:ring-rojo-excluir">
                                    <div id="lista-opciones-excluir" class="overflow-y-auto space-y-0.5 flex-grow"></div>
                                </div>
                            </div>
                            <div id="container-chips-excluir" class="flex flex-wrap gap-1 min-h-[28px]"></div>
                        </div>
                    </div>

                    <div class="flex justify-end pt-1">
                        <button type="button" onclick="limpiarFiltros()" class="text-sm text-gray-500 hover:text-verde-ingles font-medium flex items-center gap-1 transition">
                            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                            <span>Resetear filtros</span>
                        </button>
                    </div>
                </div>

                <div id="contenedor-recetas-apiladas" class="flex flex-col gap-5"></div>

                <div id="estado-vacio" class="hidden text-center py-16 px-6 bg-white rounded-2xl border border-dashed border-beige-border"></div>
            </section>

            <!-- PESTAÑA AGREGAR RECETA -->
            <section id="pestana-agregar" class="hidden">
                <div class="bg-beige-card rounded-2xl p-6 sm:p-9 shadow-soft border border-beige-border space-y-6">
                    <div class="flex justify-between items-center border-b border-beige-border pb-3">
                        <h2 id="formulario-titulo" class="text-base font-semibold text-verde-ingles">Agregar Receta</h2>
                        <button id="btn-cancelar-edicion" type="button" onclick="cancelarEdicion()" class="hidden text-sm text-gray-500 hover:text-rojo-excluir underline">
                            Cancelar edición
                        </button>
                    </div>

                    <form id="form-receta" onsubmit="guardarReceta(event)" class="space-y-6">
                        <input type="hidden" id="receta-id">

                        <div>
                            <label class="block text-sm font-semibold text-verde-ingles mb-2">Nombre de la receta *</label>
                            <input type="text" id="input-nombre" required placeholder="Ej: Milanesas con Puré" class="w-full p-3 bg-beige-base border border-beige-border rounded-xl text-sm focus:ring-1 focus:ring-verde-ingles focus:outline-none">
                        </div>

                        <div>
                            <label class="block text-sm font-semibold text-verde-ingles mb-2">Breve descripción (opcional)</label>
                            <input type="text" id="input-descripcion" placeholder="Ej: Plato clásico crocante con puré cremoso" class="w-full p-3 bg-beige-base border border-beige-border rounded-xl text-sm focus:ring-1 focus:ring-verde-ingles focus:outline-none">
                        </div>

                        <div class="space-y-1.5">
                            <label class="block text-sm font-semibold text-verde-ingles">Ingredientes de la receta *</label>
                            <div class="relative">
                                <button type="button" onclick="toggleDropdownFormIngredientes()" class="w-full bg-beige-base border border-beige-border rounded-xl p-3 text-left flex justify-between items-center text-sm shadow-sm hover:border-verde-ingles focus:outline-none">
                                    <span class="text-gray-500" id="label-dropdown-form-ing">Buscar o agregar ingrediente...</span>
                                    <svg class="w-4 h-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                                </button>

                                <div id="dropdown-form-ingredientes" class="hidden absolute left-0 right-0 top-full mt-1 bg-white border border-beige-border rounded-xl shadow-soft-lg z-30 max-h-56 flex flex-col p-2 space-y-1.5">
                                    <input type="text" id="input-buscar-ingrediente-form" placeholder="Escribe un ingrediente..." oninput="filtrarDropdownFormIngredientes()" class="w-full p-2.5 text-sm bg-beige-base border border-beige-border rounded-lg focus:outline-none focus:ring-1 focus:ring-verde-ingles">
                                    <div id="lista-opciones-form-ingredientes" class="overflow-y-auto space-y-0.5 flex-grow"></div>
                                </div>
                            </div>
                            <div id="container-chips-form-ingredientes" class="flex flex-wrap gap-1 pt-1 min-h-[28px]"></div>
                        </div>

                        <div class="space-y-1.5 pt-2">
                            <label class="block text-sm font-semibold text-verde-ingles">Cantidades por ingrediente</label>
                            <div class="border border-beige-border rounded-xl overflow-hidden bg-beige-base">
                                <table class="w-full text-left text-sm">
                                    <thead class="bg-beige-border/50 text-verde-ingles font-semibold">
                                        <tr>
                                            <th class="py-2 px-3 w-1/2">Ingrediente</th>
                                            <th class="py-2 px-3 w-1/2">Cantidad</th>
                                        </tr>
                                    </thead>
                                    <tbody id="tabla-body-cantidades" class="divide-y divide-beige-border">
                                        <tr id="row-sin-ingredientes">
                                            <td colspan="2" class="p-3 text-center text-gray-400">Selecciona ingredientes arriba para cargar sus cantidades.</td>
                                        </tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>

                        <div>
                            <label class="block text-sm font-semibold text-verde-ingles mb-2">Procedimiento (opcional)</label>
                            <textarea id="input-procedimiento" rows="3" placeholder="Paso a paso para la preparación..." class="w-full p-3 bg-beige-base border border-beige-border rounded-xl text-sm focus:ring-1 focus:ring-verde-ingles focus:outline-none"></textarea>
                        </div>

                        <div class="border-t border-beige-border pt-3 space-y-2">
                            <label class="block text-sm font-semibold text-verde-ingles">Enlaces de referencia (opcional)</label>
                            <div class="grid grid-cols-1 sm:grid-cols-3 gap-2">
                                <div class="flex items-center gap-2 bg-beige-base p-2 rounded-xl border border-beige-border">
                                    <svg class="w-4 h-4 text-pink-600 flex-shrink-0" fill="currentColor" viewBox="0 0 24 24"><path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zm0-2.163c-3.259 0-3.667.014-4.947.072-4.358.2-6.78 2.618-6.98 6.98-.059 1.281-.073 1.689-.073 4.948 0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98-1.281-.059-1.69-.073-4.949-.073zm0 5.838c-3.403 0-6.162 2.759-6.162 6.162s2.759 6.163 6.162 6.163 6.162-2.759 6.162-6.163c0-3.403-2.759-6.162-6.162-6.162zm0 10.162c-2.209 0-4-1.79-4-4 0-2.209 1.791-4 4-4s4 1.791 4 4c0 2.21-1.791 4-4 4zm6.406-11.845c-.796 0-1.441.645-1.441 1.44s.645 1.44 1.441 1.44c.795 0 1.439-.645 1.439-1.44s-.644-1.44-1.439-1.44z"/></svg>

        async function ejecutarRegistro(e) {

                btn.innerText = 'Crear cuenta';

                mostrarMensaje('No se pudo cargar Supabase. Desactivá el bloqueador de anuncios y recargá.', false);

            if (!REGEX_USUARIO.test(usuario)) {
                mostrarMensaje('El usuario debe tener de 3 a 20 caracteres: letras minúsculas, números y _.', false);
                return;

            try {
                const disponible = await usuarioDisponible(usuario);
                if (disponible === false) {
                    mostrarMensaje('Ese nombre de usuario ya está en uso. Elegí otro.', false);
                    return;

                const { data, error } = await db.auth.signUp({
                    email,
                    password,
                    options: { data: { nombre, usuario }, emailRedirectTo: window.location.origin }

                if (error) {
                    console.error('Error de registro:', error);
                    if (/already registered/i.test(error.message)) {
                        mostrarMensaje('Ese email ya está registrado. Ingresá con tu email y contraseña.', false);
                    } else if (/database error saving new user/i.test(error.message)) {
                        mostrarMensaje('No se pudo crear la cuenta. Puede que ese nombre de usuario ya esté en uso.', false);
                    } else if (/password/i.test(error.message)) {
                        mostrarMensaje('La contraseña debe tener al menos 6 caracteres.', false);
                    } else {
                        mostrarMensaje('Error: ' + error.message, false);
                    }
                    return;
                }

                // Supabase devuelve un usuario sin identidades cuando el email ya existe
                if (data.user && data.user.identities && data.user.identities.length === 0) {
                    mostrarMensaje('Ese email ya está registrado. Ingresá con tu email y contraseña.', false);

                if (data.session) {
                    usuarioActual = data.user;
                    btn.disabled = false;
                    btn.innerText = 'Crear cuenta';
                    mostrarAppPrincipal();
                } else {
                    mostrarMensaje('¡Cuenta creada! Te enviamos un mail para confirmarla. Después de confirmar, ingresá con tu email.', true);
                }
            } catch (err) {
                console.error('Error de conexión:', err);
                mostrarMensaje('No se pudo conectar con la base de datos.', false);
            }
        }

        const REGEX_USUARIO = /^[a-z0-9_]{3,20}$/;
        let timerUsuario = null;

        async function usuarioDisponible(usuario) {
            try {
                const { data, error } = await db.rpc('usuario_disponible', { p_usuario: usuario });
                if (error) throw error;
                return data === true;
            } catch (err) {
                console.warn('No se pudo verificar el usuario:', err);
                return null;
            }
        }

        function verificarUsuarioLive() {
            const input = document.getElementById('reg-usuario');

            input.value = input.value.toLowerCase().replace(/[^a-z0-9_]/g, '');
            const v = input.value;
            clearTimeout(timerUsuario);

            const poner = (texto, clase) => { hint.innerText = texto; hint.className = 'text-xs mt-2 ' + clase; };

            if (!v) return poner('3 a 20 caracteres: letras minúsculas, números y _', 'text-gray-500');
            if (!REGEX_USUARIO.test(v)) return poner('Mínimo 3 caracteres.', 'text-gray-500');

            poner('Verificando...', 'text-gray-500');
            timerUsuario = setTimeout(async () => {
                const disp = await usuarioDisponible(v);
                if (input.value !== v) return;
                if (disp === true) poner('Disponible', 'text-green-700 font-medium');
                else if (disp === false) poner('Ese usuario ya está en uso', 'text-rojo-excluir font-medium');
                else poner('3 a 20 caracteres: letras minúsculas, números y _', 'text-gray-500');
            }, 400);
        }

        // ---------- Perfil ----------
        async function cargarPerfil() {
            perfilActual = null;
            const emailBase = (usuarioActual.email || 'usuario').split('@')[0];
            const nombreBase = (usuarioActual.user_metadata && usuarioActual.user_metadata.nombre) || emailBase;
            try {
                let { data, error } = await db.from('perfiles').select('*').eq('id', usuarioActual.id).maybeSingle();
                if (error) throw error;

                if (!data) {
                    let base = emailBase.toLowerCase().replace(/[^a-z0-9_]/g, '');
                    if (base.length < 3) base = 'user' + Math.floor(1000 + Math.random() * 9000);
                    for (let i = 0; i < 4 && !data; i++) {
                        const candidato = i === 0 ? base : base.slice(0, 15) + Math.floor(1000 + Math.random() * 9000);
                        const ins = await db.from('perfiles').insert({ id: usuarioActual.id, usuario: candidato, nombre: nombreBase }).select().maybeSingle();
                        if (!ins.error) data = ins.data;
                    }
                }
                perfilActual = data;
            } catch (err) {
                console.warn('No se pudo cargar el perfil:', err);
            }
            if (!perfilActual) perfilActual = { usuario: emailBase, nombre: nombreBase, avatar_url: null, local: true };
            pintarAvatarHeader();

        async function guardarPerfil() {
            const nombre = document.getElementById('perfil-nombre').value.trim();
            if (!nombre) return mensajePerfil('El nombre no puede estar vacío.', false);
            if (perfilActual.local) return mensajePerfil('Tu perfil todavía no está configurado en la base de datos.', false);

            const { error } = await db.from('perfiles').update({ nombre }).eq('id', usuarioActual.id);
            if (error) return mensajePerfil('No se pudo guardar: ' + error.message, false);

            perfilActual.nombre = nombre;
            pintarAvatarHeader();
            mensajePerfil('Cambios guardados.', true);
        }

        function redimensionarImagen(archivo, lado) {
            return new Promise((resolve, reject) => {
                const url = URL.createObjectURL(archivo);
                const img = new Image();
                img.onload = () => {
                    const min = Math.min(img.width, img.height);
                    const sx = (img.width - min) / 2;
                    const sy = (img.height - min) / 2;
                    const canvas = document.createElement('canvas');
                    canvas.width = lado; canvas.height = lado;
                    canvas.getContext('2d').drawImage(img, sx, sy, min, min, 0, 0, lado, lado);
                    URL.revokeObjectURL(url);
                    canvas.toBlob(b => b ? resolve(b) : reject(new Error('No se pudo procesar la imagen')), 'image/jpeg', 0.88);
                };
                img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('No se pudo leer la imagen')); };
                img.src = url;
            });
        }

        async function cambiarAvatar(input) {
            const archivo = input.files && input.files[0];
            input.value = '';
            if (!archivo) return;
            if (!archivo.type.startsWith('image/')) return mensajePerfil('Elegí un archivo de imagen.', false);
            if (archivo.size > 15 * 1024 * 1024) return mensajePerfil('La imagen es muy pesada (máximo 15 MB).', false);
            if (perfilActual.local) return mensajePerfil('Tu perfil todavía no está configurado en la base de datos.', false);

            const textoBtn = document.getElementById('perfil-foto-texto');
            textoBtn.innerText = 'Subiendo...';
            try {
                const blob = await redimensionarImagen(archivo, 384);
                const nombreArchivo = `avatar-${Date.now()}.jpg`;
                const ruta = `${usuarioActual.id}/${nombreArchivo}`;

                const { error: errSubida } = await db.storage.from('avatares').upload(ruta, blob, { contentType: 'image/jpeg', cacheControl: '3600' });
                if (errSubida) throw errSubida;

                const { data: pub } = db.storage.from('avatares').getPublicUrl(ruta);
                const { error: errPerfil } = await db.from('perfiles').update({ avatar_url: pub.publicUrl }).eq('id', usuarioActual.id);
                if (errPerfil) throw errPerfil;

                perfilActual.avatar_url = pub.publicUrl;
                document.getElementById('perfil-avatar-grande').innerHTML = avatarHTML(perfilActual, 'w-24 h-24', 'text-3xl');
                pintarAvatarHeader();
                mensajePerfil('Foto actualizada.', true);

                // limpiar fotos anteriores (si falla, no importa)
                try {
                    const { data: viejas } = await db.storage.from('avatares').list(usuarioActual.id);
                    const borrar = (viejas || []).filter(f => f.name !== nombreArchivo).map(f => `${usuarioActual.id}/${f.name}`);
                    if (borrar.length) await db.storage.from('avatares').remove(borrar);
                } catch (e) { /* ignorar */ }
            } catch (err) {
                console.error('Error al subir la foto:', err);
                mensajePerfil('No se pudo subir la foto: ' + (err.message || 'error desconocido'), false);
            } finally {
                textoBtn.innerText = 'Cambiar foto';
            }
        }

        }

        async function cargarRecetas() {
            const { data, error } = await db.from('recetas').select('*').eq('user_id', usuarioActual.id).order('created_at', { ascending: false });

            if (error) {
                console.error("Error cargando recetas:", error);
                return;
            }

            recetas = data.map(r => ({
                id: r.id,
                nombre: r.titulo,
                descripcion: r.descripcion || '',
                ingredientes: r.ingredientes || [],
                tablaCantidades: r.cantidades || [],
                procedimiento: r.procedimiento || '',
                instagram: r.link_ig || '',
                tiktok: r.link_tiktok || '',
                link: r.link_otro || '',
                publica: r.publica !== false
            }));

            renderizarFiltros();
            filtrarRecetas();
        }

        function cambiarPestana(pestana) {
            const activa = "px-3.5 py-2 rounded-lg text-sm font-medium transition flex items-center gap-1.5 bg-beige-card text-verde-ingles shadow-sm";
            const inactiva = "px-3.5 py-2 rounded-lg text-sm font-medium transition flex items-center gap-1.5 text-beige-card hover:text-white";
            const esFiltrar = pestana === 'filtrar';

            document.getElementById('pestana-filtrar').classList.toggle('hidden', !esFiltrar);
            document.getElementById('pestana-agregar').classList.toggle('hidden', esFiltrar);
            document.getElementById('tab-btn-filtrar').className = esFiltrar ? activa : inactiva;
            document.getElementById('tab-btn-agregar').className = esFiltrar ? inactiva : activa;
        }

        function obtenerTodosLosIngredientes() {
            const set = new Set();
            recetas.forEach(r => {
                if (Array.isArray(r.ingredientes)) {
                    r.ingredientes.forEach(i => set.add(i.trim()));
                }
            });
            return Array.from(set).sort((a, b) => a.localeCompare(b, 'es', { sensitivity: 'base' }));
        }

        function toggleDropdown(id) {
            const el = document.getElementById(id);
            const estaOculto = el.classList.contains('hidden');
            document.getElementById('dropdown-incluir').classList.add('hidden');
            document.getElementById('dropdown-excluir').classList.add('hidden');
            if (estaOculto) el.classList.remove('hidden');
        }

        function renderizarFiltros() {
            const todos = obtenerTodosLosIngredientes();
            renderizarOpciones('incluir', todos);
            renderizarOpciones('excluir', todos);
            renderizarChips();
        }

        function renderizarOpciones(tipo, lista) {
            const contenedor = document.getElementById(`lista-opciones-${tipo}`);
            const seleccionados = tipo === 'incluir' ? ingredientesIncluidos : ingredientesExcluidos;
            const opuesto = tipo === 'incluir' ? ingredientesExcluidos : ingredientesIncluidos;

            contenedor.innerHTML = '';
            const disponibles = lista.filter(i => !seleccionados.includes(i) && !opuesto.includes(i));

            if (disponibles.length === 0) {
                contenedor.innerHTML = `<div class="text-sm text-gray-400 p-2 text-center">Sin opciones disponibles</div>`;
                return;
            }

            disponibles.forEach(ing => {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.className = 'w-full text-left px-2 py-1 text-sm rounded-md hover:bg-beige-base flex items-center justify-between text-gray-700 transition';
                btn.innerHTML = `<span>${esc(ing)}</span> <svg class="w-3.5 h-3.5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>`;
                btn.onclick = () => seleccionarIngrediente(tipo, ing);
                contenedor.appendChild(btn);
            });
        }

        function filtrarOpcionesDropdown(tipo) {
            const query = document.getElementById(`search-${tipo}`).value.toLowerCase();
            const todos = obtenerTodosLosIngredientes().filter(i => i.toLowerCase().includes(query));
            renderizarOpciones(tipo, todos);
        }

        function seleccionarIngrediente(tipo, ingrediente) {
            if (tipo === 'incluir') {
                if (!ingredientesIncluidos.includes(ingrediente)) ingredientesIncluidos.push(ingrediente);
            } else {
                if (!ingredientesExcluidos.includes(ingrediente)) ingredientesExcluidos.push(ingrediente);
            }
            document.getElementById(`search-${tipo}`).value = '';
            document.getElementById(`dropdown-${tipo}`).classList.add('hidden');
            renderizarFiltros();
            filtrarRecetas();
        }

        function removerIngrediente(tipo, ingrediente) {
            if (tipo === 'incluir') {
                ingredientesIncluidos = ingredientesIncluidos.filter(i => i !== ingrediente);
            } else {
                ingredientesExcluidos = ingredientesExcluidos.filter(i => i !== ingrediente);
            }
            renderizarFiltros();
            filtrarRecetas();
        }

        function renderizarChips() {
            const containerInc = document.getElementById('container-chips-incluir');
            containerInc.innerHTML = ingredientesIncluidos.map(ing => `
                <span class="chip-anim inline-flex items-center gap-1 px-2.5 py-0.5 rounded-full text-sm font-medium bg-verde-chip text-white shadow-sm">
                    ${esc(ing)}
                    <button type="button" data-ing="${esc(ing)}" onclick="removerIngrediente('incluir', this.dataset.ing)" class="hover:text-green-200 transition">
                        <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                    </button>
                </span>
            `).join('');

            const containerExc = document.getElementById('container-chips-excluir');
            containerExc.innerHTML = ingredientesExcluidos.map(ing => `
                <span class="chip-anim inline-flex items-center gap-1 px-2.5 py-0.5 rounded-full text-sm font-medium bg-rojo-excluir text-white shadow-sm">
                    ${esc(ing)}
                    <button type="button" data-ing="${esc(ing)}" onclick="removerIngrediente('excluir', this.dataset.ing)" class="hover:text-red-200 transition">
                        <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                    </button>
                </span>
            `).join('');
        }

        function limpiarFiltros() {
            ingredientesIncluidos = [];
            ingredientesExcluidos = [];
            document.getElementById('input-busqueda-nombre').value = '';
            renderizarFiltros();
            filtrarRecetas();
        }

        function filtrarRecetas() {
            const queryNombre = document.getElementById('input-busqueda-nombre').value.toLowerCase().trim();

            const resultado = recetas.filter(receta => {
                const coincideNombre = receta.nombre.toLowerCase().includes(queryNombre) || 
                                       (receta.descripcion && receta.descripcion.toLowerCase().includes(queryNombre));
                if (!coincideNombre) return false;

                const ingsReceta = receta.ingredientes.map(i => i.toLowerCase().trim());

                if (ingredientesExcluidos.length > 0) {
                    const tieneExcluido = ingredientesExcluidos.some(e => ingsReceta.includes(e.toLowerCase().trim()));
                    if (tieneExcluido) return false;
                }

                if (ingredientesIncluidos.length > 0) {
                    const tieneTodosIncluidos = ingredientesIncluidos.every(i => ingsReceta.includes(i.toLowerCase().trim()));
                    if (!tieneTodosIncluidos) return false;
                }

                return true;
            });

            renderizarTarjetasApiladas(resultado);
        }

        function toggleExpandirTarjeta(id) {
            estadoExpandido[id] = !estadoExpandido[id];
            filtrarRecetas();
        }

        const ICONO_MUNDO = 'M3.055 11H5a2 2 0 012 2v1a2 2 0 002 2 2 2 0 012 2v2.945M8 3.935V5.5A2.5 2.5 0 0010.5 8h.5a2 2 0 012 2 2 2 0 104 0 2 2 0 012-2h1.064M15 20.488V18a2 2 0 012-2h3.064M21 12a9 9 0 11-18 0 9 9 0 0118 0z';
        const ICONO_CANDADO = 'M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z';

        function renderizarTarjetasApiladas(lista) {
            const contenedor = document.getElementById('contenedor-recetas-apiladas');
            const estadoVacio = document.getElementById('estado-vacio');
            const contador = document.getElementById('contador-resultados');

            contador.innerText = `${lista.length} ${lista.length === 1 ? 'receta' : 'recetas'}`;
            document.getElementById('card-filtros').classList.toggle('hidden', recetas.length === 0);

            if (lista.length === 0) {
                contenedor.innerHTML = '';
                estadoVacio.classList.remove('hidden');
                if (recetas.length === 0) {
                    estadoVacio.innerHTML = `
                        <div class="inline-flex p-4 bg-beige-base rounded-2xl text-mostaza mb-5">
                            <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"></path></svg>
                        </div>
                        <h3 class="text-lg font-semibold text-verde-ingles">Todavía no tenés recetas</h3>
                        <p class="text-sm text-gray-500 mt-2 mb-6">Cargá la primera y empezá a armar tu recetario.</p>
                        <button type="button" onclick="cambiarPestana('agregar')" class="bg-verde-ingles text-white px-5 py-2.5 rounded-xl text-sm font-medium hover:bg-verde-hover transition shadow-soft">Agregar mi primera receta</button>`;
                } else {
                    estadoVacio.innerHTML = `
                        <div class="inline-flex p-4 bg-beige-base rounded-2xl text-gray-400 mb-5">
                            <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                        </div>
                        <h3 class="text-lg font-semibold text-verde-ingles">No hay recetas que coincidan</h3>
                        <p class="text-sm text-gray-500 mt-2 mb-6">Probá quitar ingredientes excluidos o cambiar la búsqueda.</p>
                        <button type="button" onclick="limpiarFiltros()" class="bg-verde-ingles text-white px-5 py-2.5 rounded-xl text-sm font-medium hover:bg-verde-hover transition shadow-soft">Limpiar filtros</button>`;
                }
                return;
            }

            estadoVacio.classList.add('hidden');

            contenedor.innerHTML = lista.map(receta => {
                const estaExpandida = !!estadoExpandido[receta.id];
                const ig = urlSegura(receta.instagram);
                const tt = urlSegura(receta.tiktok);
                const web = urlSegura(receta.link);
                const tieneRedes = ig || tt || web;

                const filasTabla = (receta.tablaCantidades || []).map(item => `
                    <tr class="border-b border-beige-border/60 last:border-0">
                        <td class="py-2.5 px-4 font-medium text-gray-800">${esc(item.ingrediente)}</td>
                        <td class="py-2.5 px-4 text-gray-600">${esc(item.cantidad || '-')}</td>
                    </tr>
                `).join('');

                const chips = receta.ingredientes.map(ing => {
                    const esIncluido = ingredientesIncluidos.includes(ing);
                    const claseChip = esIncluido
                        ? 'bg-verde-chip text-white font-medium'
                        : 'bg-beige-base text-gray-600 border border-beige-border';
                    return `<span class="px-3 py-1 rounded-full text-xs ${claseChip}">${esc(ing)}</span>`;
                }).join('');

                const badgeClase = receta.publica
                    ? 'text-verde-chip bg-green-50 border-green-200 hover:bg-green-100'
                    : 'text-gray-600 bg-beige-base border-beige-border hover:bg-beige-border/60';

                return `
                <article class="bg-white rounded-2xl p-6 shadow-soft border border-beige-border space-y-4">
                    <div class="flex justify-between items-start gap-3">
                        <div class="min-w-0 space-y-1">
                            <h3 class="text-lg font-semibold text-verde-ingles leading-snug">${esc(receta.nombre)}</h3>
                            ${receta.descripcion ? `<p class="text-sm text-gray-500">${esc(receta.descripcion)}</p>` : ''}
                        </div>
                        <div class="flex items-center gap-1 shrink-0">
                            <button onclick="prepararEdicion('${receta.id}')" title="Editar" class="p-2 rounded-lg text-gray-400 hover:text-verde-ingles hover:bg-beige-base transition">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path></svg>
                            </button>
                            <button onclick="eliminarReceta('${receta.id}')" title="Eliminar" class="p-2 rounded-lg text-gray-400 hover:text-rojo-excluir hover:bg-beige-base transition">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                            </button>
                        </div>
                    </div>

                    <div class="flex flex-wrap gap-2">${chips}</div>

                    <div class="flex items-center justify-between gap-3 pt-2">
                        <button type="button" onclick="alternarPrivacidad('${receta.id}')" title="${receta.publica ? 'Pública: tocá para hacerla privada' : 'Privada: tocá para hacerla pública'}" class="inline-flex items-center gap-1.5 text-xs font-medium px-3 py-1.5 rounded-full border transition ${badgeClase}">
                            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="${receta.publica ? ICONO_MUNDO : ICONO_CANDADO}"></path></svg>
                            <span>${receta.publica ? 'Pública' : 'Privada'}</span>
                        </button>
                        <button onclick="toggleExpandirTarjeta('${receta.id}')" class="px-3.5 py-1.5 rounded-full text-verde-ingles hover:bg-beige-base transition border border-beige-border flex items-center gap-1.5 text-sm font-medium">
                            <span>${estaExpandida ? 'Ver menos' : 'Ver más'}</span>
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="${estaExpandida ? 'M5 15l7-7 7 7' : 'M19 9l-7 7-7-7'}"></path></svg>
                        </button>
                    </div>

                    ${estaExpandida ? `
                    <div class="pt-5 border-t border-beige-border space-y-5 chip-anim">
                        <div class="space-y-2">
                            <span class="text-sm font-semibold text-verde-ingles">Ingredientes y cantidades</span>
                            <div class="border border-beige-border rounded-xl overflow-hidden bg-white">
                                <table class="w-full text-left text-sm">
                                    <thead class="bg-beige-base text-verde-ingles font-semibold border-b border-beige-border">
                                        <tr>
                                            <th class="py-2.5 px-4">Ingrediente</th>
                                            <th class="py-2.5 px-4">Cantidad</th>
                                        </tr>
                                    </thead>
                                    <tbody>${filasTabla}</tbody>
                                </table>
                            </div>
                        </div>

                        ${receta.procedimiento ? `
                        <div class="space-y-2">
                            <span class="text-sm font-semibold text-verde-ingles">Procedimiento</span>
                            <p class="text-sm text-gray-700 leading-relaxed whitespace-pre-line bg-beige-base/70 p-4 rounded-xl">${esc(receta.procedimiento)}</p>
                        </div>
                        ` : ''}

                        ${tieneRedes ? `
                        <div class="flex flex-wrap gap-2">
                            ${ig ? `<a href="${esc(ig)}" target="_blank" rel="noopener noreferrer" class="inline-flex items-center gap-1.5 px-3.5 py-2 bg-pink-50 text-pink-700 rounded-lg text-sm font-medium border border-pink-200 hover:bg-pink-100 transition">Instagram</a>` : ''}
                            ${tt ? `<a href="${esc(tt)}" target="_blank" rel="noopener noreferrer" class="inline-flex items-center gap-1.5 px-3.5 py-2 bg-gray-100 text-gray-800 rounded-lg text-sm font-medium border border-gray-300 hover:bg-gray-200 transition">TikTok</a>` : ''}
                            ${web ? `<a href="${esc(web)}" target="_blank" rel="noopener noreferrer" class="inline-flex items-center gap-1.5 px-3.5 py-2 bg-amber-50 text-amber-800 rounded-lg text-sm font-medium border border-amber-200 hover:bg-amber-100 transition">Enlace web</a>` : ''}
                        </div>
                        ` : ''}
                    </div>
                    ` : ''}
                </article>
            `}).join('');
        }

        async function alternarPrivacidad(id) {
            const r = recetas.find(x => x.id === id);
            if (!r) return;
            const nueva = !r.publica;
            const { error } = await db.from('recetas').update({ publica: nueva }).eq('id', id);
            if (error) {
                alert('No se pudo cambiar la privacidad: ' + error.message);
                return;
            }
            r.publica = nueva;
            filtrarRecetas();
        }

        function toggleDropdownFormIngredientes() {
            const dropdown = document.getElementById('dropdown-form-ingredientes');
            const estaOculto = dropdown.classList.contains('hidden');
            if (estaOculto) {
                dropdown.classList.remove('hidden');
                document.getElementById('input-buscar-ingrediente-form').focus();
                filtrarDropdownFormIngredientes();
            } else {
                dropdown.classList.add('hidden');
            }
        }

        function filtrarDropdownFormIngredientes() {
            const query = document.getElementById('input-buscar-ingrediente-form').value.trim();
            const queryLower = query.toLowerCase();
            const contenedor = document.getElementById('lista-opciones-form-ingredientes');
            contenedor.innerHTML = '';

            const todosDB = obtenerTodosLosIngredientes();
            const disponibles = todosDB.filter(ing => 
                !ingredientesFormSeleccionados.includes(ing) && 
                ing.toLowerCase().includes(queryLower)
            );

            disponibles.forEach(ing => {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.className = 'w-full text-left px-2 py-1 text-sm rounded-md hover:bg-beige-base flex items-center justify-between text-gray-700 transition';
                btn.innerHTML = `<span>${esc(ing)}</span> <svg class="w-3.5 h-3.5 text-verde-ingles" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>`;
                btn.onclick = () => agregarIngredienteForm(ing);
                contenedor.appendChild(btn);
            });

            const existeExacto = todosDB.some(i => i.toLowerCase() === queryLower) || 
                                 ingredientesFormSeleccionados.some(i => i.toLowerCase() === queryLower);

            if (query.length > 0 && !existeExacto) {
                const btnNuevo = document.createElement('button');
                btnNuevo.type = 'button';
                btnNuevo.className = 'w-full text-left px-2 py-1.5 text-sm rounded-md bg-verde-ingles/10 text-verde-ingles hover:bg-verde-ingles hover:text-white flex items-center justify-between font-medium transition mt-1 border border-verde-ingles/20';
                btnNuevo.innerHTML = `<span>Agregar "${esc(query)}" como nuevo ingrediente</span> <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v3m0 0v3m0-3h3m-3 0H9m12 0a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>`;
                btnNuevo.onclick = () => agregarIngredienteForm(query);
                contenedor.appendChild(btnNuevo);
            }

            if (disponibles.length === 0 && query.length === 0) {
                contenedor.innerHTML = `<div class="text-sm text-gray-400 p-2 text-center">Escribe para buscar o agregar ingrediente</div>`;
            }
        }

        function agregarIngredienteForm(ingrediente) {
            const ingFormateado = ingrediente.charAt(0).toUpperCase() + ingrediente.slice(1);
            if (!ingredientesFormSeleccionados.includes(ingFormateado)) {
                ingredientesFormSeleccionados.push(ingFormateado);
                renderizarChipsFormIngredientes();
                sincronizarTablaCantidadesAuto();
            }
            document.getElementById('input-buscar-ingrediente-form').value = '';
            document.getElementById('dropdown-form-ingredientes').classList.add('hidden');
        }

        function removerIngredienteForm(ingrediente) {
            ingredientesFormSeleccionados = ingredientesFormSeleccionados.filter(i => i !== ingrediente);
            renderizarChipsFormIngredientes();
            sincronizarTablaCantidadesAuto();
        }

        function renderizarChipsFormIngredientes() {
            const container = document.getElementById('container-chips-form-ingredientes');
            container.innerHTML = ingredientesFormSeleccionados.map(ing => `
                <span class="chip-anim inline-flex items-center gap-1 px-2.5 py-0.5 rounded-full text-sm font-medium bg-verde-ingles text-white shadow-sm">
                    ${esc(ing)}
                    <button type="button" data-ing="${esc(ing)}" onclick="removerIngredienteForm(this.dataset.ing)" class="hover:text-green-200 transition">
                        <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                    </button>
                </span>
            `).join('');
        }

        function sincronizarTablaCantidadesAuto() {
            const tbody = document.getElementById('tabla-body-cantidades');
            const valoresGuardados = {};
            const filasActuales = tbody.querySelectorAll('tr[data-ingrediente]');
            filasActuales.forEach(fila => {
                const ingKey = fila.getAttribute('data-ingrediente');
                const valCant = fila.querySelector('input').value;
                valoresGuardados[ingKey] = valCant;
            });

            tbody.innerHTML = '';

            if (ingredientesFormSeleccionados.length === 0) {
                tbody.innerHTML = `
                    <tr id="row-sin-ingredientes">
                        <td colspan="2" class="p-3 text-center text-gray-400">Selecciona ingredientes arriba para cargar sus cantidades.</td>
                    </tr>
                `;
                return;
            }

            ingredientesFormSeleccionados.forEach(ing => {
                const cantidadPrevia = valoresGuardados[ing] || '';
                const tr = document.createElement('tr');
                tr.setAttribute('data-ingrediente', ing);
                tr.className = "hover:bg-beige-card/50 transition border-b border-beige-border last:border-0";
                tr.innerHTML = `
                    <td class="p-2 font-medium text-gray-800 text-sm">${esc(ing)}</td>
                    <td class="p-2">
                        <input type="text" value="${esc(cantidadPrevia)}" placeholder="Ej: 200 g, 1 cda, a gusto" class="w-full p-1.5 text-sm bg-white border border-beige-border rounded-lg focus:ring-1 focus:ring-verde-ingles focus:outline-none">
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        async function guardarReceta(e) {
            e.preventDefault();
            const id = document.getElementById('receta-id').value;
            const titulo = document.getElementById('input-nombre').value.trim();
            const descripcion = document.getElementById('input-descripcion').value.trim();
            const procedimiento = document.getElementById('input-procedimiento').value;
            const link_ig = document.getElementById('input-instagram').value.trim();
            const link_tiktok = document.getElementById('input-tiktok').value.trim();
            const link_otro = document.getElementById('input-link').value.trim();

            if (ingredientesFormSeleccionados.length === 0) {
                alert('Por favor selecciona al menos un ingrediente.');
                return;
            }

            const cantidades = [];
            const filas = document.querySelectorAll('#tabla-body-cantidades tr[data-ingrediente]');
            filas.forEach(fila => {
                const ing = fila.getAttribute('data-ingrediente');
                const cant = fila.querySelector('input').value.trim();
                cantidades.push({ ingrediente: ing, cantidad: cant });
            });

            const datosReceta = {
                titulo,
                descripcion,
                ingredientes: [...ingredientesFormSeleccionados],
                cantidades,
                procedimiento,
                link_ig,
                link_tiktok,
                link_otro,
                publica: document.getElementById('input-publica').checked,
                user_id: usuarioActual.id
            };

            if (id) {
                const { error } = await db.from('recetas').update(datosReceta).eq('id', id);
                if (error) alert("Error al actualizar la receta: " + error.message);
            } else {
                const { error } = await db.from('recetas').insert([datosReceta]);
                if (error) alert("Error al guardar la receta: " + error.message);
            }

            await cargarRecetas();
            cancelarEdicion();
            cambiarPestana('filtrar');
        }

        function prepararEdicion(id) {
            const receta = recetas.find(r => r.id === id);
            if (!receta) return;

            document.getElementById('receta-id').value = receta.id;
            document.getElementById('formulario-titulo').innerText = 'Editar Receta';
            document.getElementById('btn-cancelar-edicion').classList.remove('hidden');

            document.getElementById('input-nombre').value = receta.nombre;
            document.getElementById('input-descripcion').value = receta.descripcion || '';
            document.getElementById('input-procedimiento').value = receta.procedimiento || '';
            document.getElementById('input-instagram').value = receta.instagram || '';
            document.getElementById('input-tiktok').value = receta.tiktok || '';
            document.getElementById('input-link').value = receta.link || '';
            document.getElementById('input-publica').checked = receta.publica !== false;

            ingredientesFormSeleccionados = [...receta.ingredientes];
            renderizarChipsFormIngredientes();

            sincronizarTablaCantidadesAuto();
            if (receta.tablaCantidades) {
                receta.tablaCantidades.forEach(item => {
                    const fila = document.querySelector(`#tabla-body-cantidades tr[data-ingrediente="${CSS.escape(item.ingrediente)}"]`);
                    if (fila) {
                        fila.querySelector('input').value = item.cantidad || '';
                    }
                });
            }

            cambiarPestana('agregar');
        }

        function cancelarEdicion() {
            document.getElementById('form-receta').reset();
            document.getElementById('receta-id').value = '';
            document.getElementById('formulario-titulo').innerText = 'Agregar Receta';
            document.getElementById('btn-cancelar-edicion').classList.add('hidden');
            ingredientesFormSeleccionados = [];
            renderizarChipsFormIngredientes();
            sincronizarTablaCantidadesAuto();
        }

        async function eliminarReceta(id) {
            if (confirm("¿Seguro que deseas eliminar esta receta?")) {
                const { error } = await db.from('recetas').delete().eq('id', id);
                if (error) {
                    alert("Error al eliminar la receta: " + error.message);
                } else {
                    await cargarRecetas();
                }
            }
        }
    </script>
</body>
</html>
